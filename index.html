<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hamanien Services</title>
<meta name="theme-color" content="#6B2F25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hamanien">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: en-tête collant (marque, devise, export) + onglets défilants + une colonne de blocs, 2 colonnes au-delà de 860px. */
:root{
  --bg:#F5F3F1; --surface:#FFFFFF; --surface2:#EDE7E3; --ink:#2A1713; --muted:#74605A; --muted2:#B9A8A1; --line:#E1D7D1;
  --accent:#6B2F25; --accent-ink:#FFFFFF; --accent-soft:#F0E1DC; --gold:#B8903A;
  --gain:#1A7A48; --loss:#B23A27; --warn:#9A6408; --warn-soft:#F6E8CF; --loss-soft:#F5DAD4; --gain-soft:#D6EDE0;
  --c1:#1F7A74; --c2:#B8903A; --c3:#4B58A8; --c4:#B0426A; --c5:#5B8C2A; --c6:#5C6B73;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150C0A; --surface:#221512; --surface2:#2E1F1B; --ink:#F4EAE4; --muted:#B49E95; --muted2:#6A5249; --line:#42302A;
  --accent:#D8B25C; --accent-ink:#1A0F0D; --accent-soft:#3A2B15; --gold:#D8B25C;
  --gain:#52C98A; --loss:#F08A76; --warn:#E5AE55; --warn-soft:#3A2D12; --loss-soft:#44211B; --gain-soft:#15392A;
  --c1:#4FC2BA; --c2:#E5C36E; --c3:#8E9BE8; --c4:#EE86AB; --c5:#98CC5C; --c6:#9FB0B9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150C0A; --surface:#221512; --surface2:#2E1F1B; --ink:#F4EAE4; --muted:#B49E95; --muted2:#6A5249; --line:#42302A;
  --accent:#D8B25C; --accent-ink:#1A0F0D; --accent-soft:#3A2B15; --gold:#D8B25C;
  --gain:#52C98A; --loss:#F08A76; --warn:#E5AE55; --warn-soft:#3A2D12; --loss-soft:#44211B; --gain-soft:#15392A;
  --c1:#4FC2BA; --c2:#E5C36E; --c3:#8E9BE8; --c4:#EE86AB; --c5:#98CC5C; --c6:#9FB0B9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font:700 22px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--loss)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:700px){header.top{position:static}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:18px;display:grid;gap:18px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar label{color:var(--muted);font-size:13px}
select,input[type=text],input[type=number],input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%}
h2{font:700 18px/1.2 var(--f-display);margin:0 0 12px;letter-spacing:-.005em}
h3{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font:700 24px/1.15 var(--f-display);margin-top:6px;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.vrow{display:grid;grid-template-columns:minmax(150px,1.3fr) repeat(3,1fr) 64px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0}
.vrow .n{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.vrow .n i{width:10px;height:10px;border-radius:3px;flex:none}
.vrow small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.cell small{display:block;color:var(--muted);font-size:12px}
.vhead{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
@media(max-width:620px){
  .vrow{grid-template-columns:1fr 1fr 1fr}
  .vrow .n{grid-column:1/-1}
  .vrow .pct{display:none}
  .vhead{display:none}}
.bars{display:grid;gap:9px}
.brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.brow .t{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.brow .t b{display:block;height:100%;background:var(--accent);border-radius:5px}
.brow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg text{fill:var(--muted);font:11px var(--f-body)}
svg .b-rec{fill:var(--accent)} svg .b-chg{fill:var(--muted2)} svg .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{width:100%}
.amt{display:flex;gap:6px}.amt input{flex:1;min-width:0}.amt select{width:78px;flex:none}
.hint{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.gain{background:var(--gain-soft);color:var(--gain)} .chip.loss{background:var(--loss-soft);color:var(--loss)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.wk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk b{font:600 16px var(--f-display)}
.drow{display:grid;grid-template-columns:minmax(130px,1.2fr) 90px minmax(130px,1fr) minmax(110px,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
@media(max-width:700px){.drow{grid-template-columns:1fr 1fr}.drow>:first-child{grid-column:1/-1}}
.drow input{width:100%}
.list .it{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .d{color:var(--muted);font-size:13px}
.list .it .w{min-width:0}.list .it .w small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
@media(max-width:560px){.list .it{grid-template-columns:56px minmax(0,1fr) auto}.list .it .ac{grid-column:2/-1}}
.ac{display:flex;gap:6px}
.edit{grid-column:1/-1;background:var(--surface2);border-radius:10px;padding:12px}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{padding:7px 0;border-radius:7px;font-size:13px;background:var(--surface2)}
.cal .h{background:none;color:var(--muted);font-size:11px;font-weight:600}
.cal .z{background:none}
.cal .bk{background:var(--c4);color:#fff;font-weight:600}
.cal .td{outline:2px solid var(--accent)}
.vcard h2{display:flex;gap:8px;align-items:center}
.vcard h2 i{width:12px;height:12px;border-radius:4px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
@media(max-width:480px){.mini{grid-template-columns:1fr 1fr}}
.prog{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:6px 0}
.prog b{display:block;height:100%;background:var(--accent)}
.logo{width:54px;height:52px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line);background:#fff}
.brand{display:flex;gap:12px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px 2px 7px;border-radius:999px;background:var(--surface2);color:var(--ink);white-space:nowrap;letter-spacing:.02em}
.tag i{width:9px;height:9px;border-radius:50%;flex:none}
.plate{font-size:11px;font-weight:600;border:1px solid var(--muted2);border-radius:5px;padding:0 6px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.rank{display:grid;grid-template-columns:28px minmax(150px,1.2fr) 2fr auto;grid-template-areas:"p i b r";gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rank .pos1{grid-area:p}.rank .id{grid-area:i}.rank .bw{grid-area:b;min-width:0}.rank .rs{grid-area:r;text-align:right}
.rank:first-of-type{border-top:0}
.rank .pos1{font:700 20px var(--f-display);color:var(--gold)}
.rank .t{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.rank .t b{display:block;height:100%;border-radius:6px}
.rank .id{display:grid;gap:3px;min-width:0}
.rank .id span.nm{font-weight:600;overflow-wrap:anywhere}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches label{cursor:pointer}.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:26px;height:26px;border-radius:50%;border:3px solid var(--surface)}
.swatches input:checked+span{outline:2px solid var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:640px){.rank{grid-template-columns:26px 1fr auto;grid-template-areas:"p i r" "p b b";row-gap:8px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
.krow{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:8px;align-items:center;padding:3px 0}.krow input{width:100%}.krow .kd{font-size:13px;text-align:right}.krow .kd small{color:var(--muted)}
.kblock{padding:10px 0;border-top:1px solid var(--line)}.kblock:first-of-type{border-top:0}.kt{margin-top:6px;font-size:14px}
.oil{padding:10px 0;border-top:1px solid var(--line)}.oil:first-of-type{border-top:0}.oil summary{cursor:pointer;color:var(--accent);font-size:14px;margin:8px 0}.oil .form{margin-top:6px}

html{color-scheme:light}
body{margin:0;font:15px/1.45 var(--f-body)}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.login .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:14px}
.login .logo{width:84px;height:81px;margin:0 auto}
.login h1{font:700 24px/1.1 var(--f-display);text-align:center;margin:0}
.login p{margin:0;text-align:center;color:var(--muted);font-size:14px}
.login .err{color:var(--loss);font-size:14px;text-align:center;min-height:1.2em}
.login input{width:100%;font-size:16px}
.login a{color:var(--accent);font-size:14px;text-align:center;cursor:pointer;text-decoration:underline}
.boot{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
</style>
